services:
  - type: web
    name: edgeguard-ai-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: EDGEGUARD_DATA_DIR
        value: /var/data/edgeguard
      - key: EDGEGUARD_CORS_ORIGINS
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
    disk:
      name: edgeguard-data
      mountPath: /var/data
      sizeGB: 5
